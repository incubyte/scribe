[workspace]
resolver = "3"
members = [
    "apps/scribe-tray/src-tauri",
    "crates/scribe-core",
    "crates/store-markdown",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
dirs = "6"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
