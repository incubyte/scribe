[workspace]
resolver = "3"
members = [
    "apps/scribe-tray/src-tauri",
    "crates/audio-macos",
    "crates/audio-mic",
    "crates/audio-resample",
    "crates/scribe-core",
    "crates/store-markdown",
    "crates/stt-speechanalyzer",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
dirs = "6"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scribe-core = { path = "crates/scribe-core" }
store-markdown = { path = "crates/store-markdown" }
audio-resample = { path = "crates/audio-resample" }
audio-mic = { path = "crates/audio-mic" }
audio-macos = { path = "crates/audio-macos" }
stt-speechanalyzer = { path = "crates/stt-speechanalyzer" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
