[package]
name = "scribe-tray"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "scribe_tray"
path = "src/lib.rs"

[[bin]]
name = "scribe-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2.7"
tauri-plugin-store = "2.4"
tauri-plugin-notification = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-positioner = { version = "2.3", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
scribe-core = { workspace = true, features = ["serde"] }
store-markdown.workspace = true
audio-mic.workspace = true
tracing.workspace = true
thiserror.workspace = true
dirs.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
stt-parakeet.workspace = true
audio-windows.workspace = true
capture-windows.workspace = true
tauri-winrt-notification = "0.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
stt-speechanalyzer.workspace = true
audio-macos.workspace = true
capture-macos.workspace = true
mac-notification-sys = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString", "NSOperation"] }
block2 = "0.6"
objc2 = "0.6"

[dev-dependencies]
scribe-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
