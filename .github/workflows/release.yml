name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build for, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: The tag matches the app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          app_version=$(jq -r .version apps/scribe-tray/src-tauri/tauri.conf.json)
          if [ "${RELEASE_TAG}" != "v${app_version}" ]; then
            echo "Tag ${RELEASE_TAG} does not match app version v${app_version} in tauri.conf.json"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/scribe-tray/package-lock.json
      - run: npm ci
        working-directory: apps/scribe-tray
      - name: Stage the MCP server the tray bundles as a sidecar
        shell: bash
        run: apps/scribe-tray/scripts/stage-sidecar.sh
      - name: Fetch the Visual C++ runtime the installer bundles
        shell: bash
        run: apps/scribe-tray/scripts/fetch-vc-redist.sh
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/scribe-tray
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.ci.conf.json
          tagName: ${{ inputs.tag }}
          releaseName: Scribe ${{ inputs.tag }}
          releaseBody: |
            Unsigned build. On first launch:
            - macOS: open System Settings → Privacy & Security and choose Open Anyway for Scribe.
            - Windows: on the SmartScreen prompt choose More info → Run anyway.
          releaseDraft: true
          prerelease: false
