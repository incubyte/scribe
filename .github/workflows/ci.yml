name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Stage the MCP server the tray bundles as a sidecar
        shell: bash
        run: apps/scribe-tray/scripts/stage-sidecar.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Only the Parakeet adapter may depend on an HTTP client
        shell: bash
        run: |
          dependents=$(cargo tree -e normal -i reqwest --depth 1 --prefix none 2>/dev/null | tail -n +2 | grep -v '^stt-parakeet ' || true)
          if [ -n "$dependents" ]; then
            echo "An HTTP client is reachable from: $dependents"
            exit 1
          fi
      - name: Exactly one ONNX Runtime binding is linked
        shell: bash
        run: |
          versions=$(cargo tree --workspace --target all --prefix none | grep -E '^ort v' | cut -d' ' -f2 | sort -u)
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "More than one ort version is linked: $versions"
            exit 1
          fi
      - name: The MCP server stays free of audio and speech dependencies
        shell: bash
        run: |
          forbidden=$(cargo tree -p scribe-mcp -e normal --prefix none | grep -E '^(cidre|cpal|wasapi|swift-rs|parakeet-rs|audio-|stt-) ' || true)
          if [ -n "$forbidden" ]; then
            echo "scribe-mcp depends on: $forbidden"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/scribe-tray/package-lock.json
      - run: npm ci
        working-directory: apps/scribe-tray
      - run: npm run lint
        working-directory: apps/scribe-tray
      - run: npm test
        working-directory: apps/scribe-tray

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stage the MCP server the tray bundles as a sidecar
        run: apps/scribe-tray/scripts/stage-sidecar.sh
      - run: cargo install cargo-mutants --locked
      - name: Mutate the pull request diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          cargo mutants --in-diff pr.diff --no-shuffle || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/scribe-tray/package-lock.json
      - run: npm ci
        working-directory: apps/scribe-tray
      - name: Mutate the frontend
        run: npx stryker run
        working-directory: apps/scribe-tray
        continue-on-error: true
      - name: Summarise mutation scores
        id: score
        run: python3 .github/scripts/mutation_summary.py > mutation-summary.md
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mutation
          path: mutation-summary.md
      - name: Fail below the mutation threshold
        run: python3 .github/scripts/mutation_summary.py --enforce 75 > /dev/null
