name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/scribe-tray/package-lock.json
      - run: npm ci
        working-directory: apps/scribe-tray
      - run: npm run lint
        working-directory: apps/scribe-tray
      - run: npm test
        working-directory: apps/scribe-tray

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - name: Mutate the pull request diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          cargo mutants --in-diff pr.diff --no-shuffle || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/scribe-tray/package-lock.json
      - run: npm ci
        working-directory: apps/scribe-tray
      - name: Mutate the frontend
        run: npx stryker run
        working-directory: apps/scribe-tray
        continue-on-error: true
      - name: Summarise mutation scores
        id: score
        run: python3 .github/scripts/mutation_summary.py > mutation-summary.md
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mutation
          path: mutation-summary.md
      - name: Fail below the mutation threshold
        run: python3 .github/scripts/mutation_summary.py --enforce 75 > /dev/null
