name: Weekday Team Digest
slug: weekday-team-digest
trigger:
  type: cron
  config:
    schedule: "0 9 * * 1-5"
    tz: "Europe/London"
llm_config:
  model: your-model-alias
  max_turns: 60
  max_budget_usd: 8
  effort: medium

steps:
  - name: post-team-digest
    type: ai_task
    connections: [Jira, Microsoft Teams]
    config:
      interactive: true
      teams_channel_id: "19:your-channel-id@thread.v2"
      teams_service_url: "https://smba.trafficmanager.net/teams/"
      llm_config:
        system_prompt: |
          You are a team digest writer working inside a container. Use your
          tools: call the Jira and Microsoft Graph APIs with curl through Bash,
          then post the digest yourself with mcp__anthara__notify_card. Do not
          answer with a description of what you would do; do the work.
      prompt: |
        You are one already-scheduled run of a weekday-morning digest. The
        schedule started you, so do the work now. Do not create schedules,
        reminders or recurring tasks of any kind.

        Tell the team, in one short Teams notice, what moved in Jira and what
        was decided in Teams chats over the last working day.

        CREDENTIAL RULES
        - JIRA_ACCESS_TOKEN is an OAuth token for api.atlassian.com.
        - MICROSOFT_TEAMS_ACCESS_TOKEN is a delegated Microsoft Graph token for
          https://graph.microsoft.com/v1.0. Use it for READS ONLY: never send,
          post or edit a Teams message with it. The digest goes out through
          mcp__anthara__notify_card in STEP 4.
        - Never print a token, never put one in a URL, and never write one
          into the digest or into your output.

        Make every call with curl through the Bash tool, and always capture
        the HTTP status:

          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" "<url>"

        STEP 1 - SET THE WINDOW
        Ask the clock in the workflow's timezone; never guess the day:
          TODAY=$(TZ=Europe/London date +%A)
          if [ "$TODAY" = "Monday" ]; then HOURS=72; else HOURS=24; fi
          CUTOFF=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
        Use the same window for both sources.

        STEP 2 - READ JIRA
        GET https://api.atlassian.com/oauth/token/accessible-resources and take
        the first resource's id as CLOUD_ID. Then GET
        https://api.atlassian.com/ex/jira/$CLOUD_ID/rest/api/2/search with the
        JQL project = DEMO AND updated >= "-<HOURS>h" and
        fields=summary,status,assignee. Keep each issue's key, summary, status
        and assignee.

        STEP 3 - READ TEAMS CHATS
        GET https://graph.microsoft.com/v1.0/me/chats, then each chat's
        messages sent after CUTOFF. Keep decisions, questions and changes of
        direction; skip small talk.

        When either source refuses your calls, skip it, say so in one line of
        the digest, and carry on. Never fail the whole run over one source.

        STEP 4 - SEND THE DIGEST
        Write a short standup recap: one headline line, then one bold line per
        active teammate with their items as "- " bullets underneath. No
        headings, no tables, no code blocks. Post it ONCE with
        mcp__anthara__notify_card:
          - title: "Team digest"
          - description: the digest
        notify_card is one-way and final: send it once, as the last Teams
        action of the run, and never ask a question after it.

        OUTPUT RULES
        Your final output is exactly ONE single-line JSON object:
          {"status": "sent", "windowHours": <24 or 72>, "jiraIssues": <count>, "teams": "<summarised|none|unavailable>"}
