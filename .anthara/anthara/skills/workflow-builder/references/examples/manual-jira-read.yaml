name: Jira Story Readiness Check
slug: jira-story-readiness-check
trigger:
  type: manual
llm_config:
  model: your-model-alias
  max_turns: 40
  max_budget_usd: 5
  effort: medium

steps:
  - name: fetch-stories
    type: read_data
    provider: jira
    connection: Jira
    config:
      query: >
        project = DEMO AND
        status = "To Do"
        ORDER BY priority DESC

  - name: check-story
    type: ai_task
    connections: [Jira]
    config:
      llm_config:
        system_prompt: |
          You are a requirements reviewer working inside a container. Use your
          tools: call the Jira REST API with curl through Bash and post the
          comment yourself. Do not answer with a description of what you would
          do; do the work.
      prompt: |
        You receive ONE Jira story as JSON from the upstream fan-out:
        {{steps.fetch-stories.output}}

        Decide whether the story is ready to build, and leave that verdict as
        one comment on the story, so the team sees it where they already work.
        Take the story's issue key (for example DEMO-12) from the JSON.

        CREDENTIAL RULES
        - JIRA_ACCESS_TOKEN is an OAuth token for api.atlassian.com only.
        - Never print it, never put it in a URL, and never write it into a
          comment or into your output.

        Make every call with curl through the Bash tool, and always capture
        the HTTP status:

          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            -H "Authorization: Bearer $JIRA_ACCESS_TOKEN" \
            -H "Accept: application/json" "<url>"

        STEP 1 - FIND THE JIRA SITE
        GET https://api.atlassian.com/oauth/token/accessible-resources and take
        the first resource's id as CLOUD_ID. Every later call goes to
        https://api.atlassian.com/ex/jira/$CLOUD_ID/rest/api/2/... When the
        list is empty or the call is not 2xx, fail the step with the status
        and body.

        STEP 2 - CHECK FOR AN EARLIER VERDICT
        GET .../issue/<issue key>?fields=comment. When any comment contains
        the line "_Readiness checked by Anthara._", stop here and output the
        already_checked shape below.

        STEP 3 - RATE THE STORY
        Score it from 1 to 5 on each of: a clear problem statement, testable
        acceptance criteria, clear scope, and known dependencies. The story is
        ready when every score is 4 or more.

        STEP 4 - POST THE VERDICT
        Write a short comment: "Ready to build" or "Not ready yet", then one
        bullet per score below 4 saying what is missing, then the line
        "_Readiness checked by Anthara._" on its own. Build the JSON body
        {"body": "<comment>"} in a temp file (BODY=$(mktemp)) and POST it to
        .../issue/<issue key>/comment with --data-binary "@$BODY" and
        -H "Content-Type: application/json". A non-2xx response fails the
        step with the status and body.

        OUTPUT RULES
        Your final output is exactly ONE single-line JSON object, one of:
          {"issueKey": "<KEY>", "status": "ready", "commentPosted": true}
          {"issueKey": "<KEY>", "status": "not_ready", "commentPosted": true, "gaps": <count>}
          {"issueKey": "<KEY>", "status": "already_checked"}
