<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Scribe notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inclusive+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light dark;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;

  --radius-control: 12px;
  --header-height: calc(var(--space-3) * 2 + 24px + 1px);

  --surface: #ebfff6;
  --header-band: #014d43;
  --on-header: #ebfff6;
  --glass: rgb(1 77 67 / 0.94);
  --heading: #014d43;
  --surface-sunken: rgb(1 77 67 / 0.05);
  --surface-hover: rgb(1 77 67 / 0.09);
  --hairline: rgb(1 77 67 / 0.2);
  --control-border: #56685f;
  --text: #1a1d23;
  --text-muted: #4a5a55;
  --accent: #014d43;
  --on-accent: #ebfff6;
  --accent-soft: rgb(1 77 67 / 0.08);
  --recording: #b3261e;
  --recording-soft: rgb(179 38 30 / 0.08);
  --button-fill: #d3fe73;
  --on-button: #014d43;
  --decor: #40a578;
  --focus-ring: 3px solid var(--accent);
  --focus-ring-offset: 2px;

  --font-body: "Inclusive Sans", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", sans-serif;
  --font-heading: "Fraunces", ui-serif, Georgia, serif;
  --font-figures: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI Variable", sans-serif;
  --text-sm: 12px;
  --text-md: 13px;
  --text-lg: 15px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #062925;
    --header-band: #0c3a34;
    --glass: rgb(12 58 52 / 0.94);
    --heading: #ebfff6;
    --surface-sunken: rgb(235 255 246 / 0.06);
    --surface-hover: rgb(235 255 246 / 0.1);
    --hairline: rgb(235 255 246 / 0.18);
    --control-border: #7fa89d;
    --text: #ebfff6;
    --text-muted: #a8cfc4;
    --accent: #d3fe73;
    --on-accent: #014d43;
    --accent-soft: rgb(211 254 115 / 0.1);
    --recording: #ff8a80;
    --recording-soft: rgb(255 138 128 / 0.12);
  }
}

@media (prefers-reduced-transparency: reduce) {
  :root {
    --glass: var(--header-band);
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}

* {
  box-sizing: border-box;
}

html {
  font-size: var(--text-md);
  scroll-padding-top: var(--header-height);
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button,
select {
  font: inherit;
}

:focus-visible {
  outline: var(--focus-ring);
  outline-offset: var(--focus-ring-offset);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.notebook {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.notebook__header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  gap: var(--space-3);
  align-items: center;
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--hairline);
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

.notebook__mark {
  flex: none;
  width: 24px;
  height: 24px;
  color: var(--on-header);
}

.notebook__title {
  margin: 0;
  color: var(--on-header);
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 650;
  line-height: 1.25;
  letter-spacing: -0.01em;
}

.notebook__count {
  margin-left: auto;
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
  color: var(--on-header);
}

.notebook__body {
  display: grid;
  flex: 1;
  grid-template-columns: minmax(200px, 280px) 1fr;
}

.sidebar {
  padding: var(--space-4) var(--space-3);
  border-right: 1px solid var(--hairline);
}

.sidebar__heading {
  margin: 0 0 var(--space-2);
  padding-left: var(--space-2);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-muted);
}

.sidebar__select {
  display: none;
  width: 100%;
  min-height: 32px;
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--control-border);
  border-radius: var(--radius-control);
  background: var(--surface);
  color: var(--text);
}

.meeting-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  list-style: none;
}

.session {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 32px;
  padding: var(--space-2);
  border: 0;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background-color 120ms ease-out;
}

.session:hover {
  background: var(--surface-hover);
}

.session[aria-current="true"] {
  background: var(--accent-soft);
  box-shadow: inset 2px 0 0 var(--accent);
}

.session__title {
  font-weight: 600;
  overflow-wrap: anywhere;
}

.session__meta {
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.meeting {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
  max-width: 760px;
  padding: var(--space-5);
}

.meeting__header {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.meeting__title {
  color: var(--heading);
  font-family: var(--font-heading);
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  line-height: 1.25;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

.meeting__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
  margin: 0;
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.badge {
  padding: 1px var(--space-2);
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--text);
  font-size: var(--text-sm);
  font-weight: 600;
}

.panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.panel__heading {
  color: var(--heading);
  font-family: var(--font-heading);
  margin: 0;
  font-size: var(--text-lg);
  font-weight: 650;
  letter-spacing: -0.01em;
}

.panel__body {
  margin: 0;
  overflow-wrap: anywhere;
}

.speakers {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.speaker {
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-control);
  background: var(--surface-sunken);
}

.speaker__name {
  cursor: pointer;
  font-weight: 600;
}

.speaker__confidence {
  font-weight: 400;
  color: var(--text-muted);
}

.speaker__evidence {
  margin: var(--space-1) 0 0;
  max-width: 48ch;
  font-size: var(--text-sm);
  color: var(--text-muted);
  overflow-wrap: anywhere;
}

.block-list,
.item-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.item {
  display: flex;
  gap: var(--space-2);
  align-items: baseline;
  padding-left: var(--space-2);
  border-left: 2px solid transparent;
}

.item::before {
  content: "";
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  transform: translateY(-2px);
}

.block {
  margin: 0;
  overflow-wrap: anywhere;
}

.block--heading {
  color: var(--heading);
  font-family: var(--font-heading);
  font-size: var(--text-lg);
  font-weight: 650;
  letter-spacing: -0.01em;
}

.block--decision {
  padding: var(--space-2) var(--space-3);
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 var(--radius-control) var(--radius-control) 0;
}

.block__label {
  display: block;
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-muted);
}

.block--metric {
  display: inline-flex;
  flex-direction: column;
  align-self: flex-start;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-control);
  background: var(--surface-sunken);
}

.block__figure {
  font-family: var(--font-figures);
  font-size: 20px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.block__note {
  font-size: var(--text-sm);
  color: var(--text-muted);
}

.block--quote {
  padding-left: var(--space-3);
  border-left: 2px solid var(--hairline);
}

.block--quote .block__label {
  margin-top: var(--space-1);
}

.block--callout {
  padding: var(--space-2) var(--space-3);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-control) var(--radius-control) 0;
  background: var(--surface-sunken);
}

.block--risk {
  border-left-color: var(--recording);
  background: var(--recording-soft);
}

.block--risk .block__label {
  color: var(--recording);
}

.block__table-scroll {
  overflow-x: auto;
}

.block__table {
  border-collapse: collapse;
  min-width: 100%;
  font-variant-numeric: tabular-nums;
}

.block__table th,
.block__table td {
  padding: var(--space-1) var(--space-3);
  border-bottom: 1px solid var(--hairline);
  text-align: left;
  vertical-align: top;
}

.block__table th {
  font-size: var(--text-sm);
  color: var(--text-muted);
}

.block--screen {
  display: flex;
  gap: var(--space-2);
  align-items: baseline;
  color: var(--text-muted);
}

.offset-chip {
  flex: none;
  padding: 1px var(--space-2);
  border-radius: 999px;
  background: var(--surface-sunken);
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.line--me {
  border-left-color: var(--accent);
}

.todo {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
}

.todo__choice {
  display: flex;
  gap: var(--space-2);
  align-items: baseline;
  cursor: pointer;
}

.todo__checkbox {
  flex: none;
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: var(--accent);
  transform: translateY(2px);
}

.todo__text {
  overflow-wrap: anywhere;
}

.todo__checkbox:checked + .todo__text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.todo__meta {
  margin: 0;
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.todo__actions-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.todo__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.button {
  display: inline-flex;
  gap: var(--space-2);
  align-items: center;
  min-height: 32px;
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--on-button);
  border-radius: 999px;
  background: var(--button-fill);
  color: var(--on-button);
  font-weight: 600;
  cursor: pointer;
}

.button:hover:not(:disabled):not([aria-disabled="true"]) {
  filter: brightness(0.94);
}

.button__arrow {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--on-button);
  color: var(--button-fill);
}

.button__arrow svg {
  width: 10px;
  height: 10px;
}

.button:disabled,
.button[aria-disabled="true"] {
  border-color: var(--control-border);
  color: var(--text-muted);
  background: transparent;
  cursor: not-allowed;
}

.todo__error {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--text-muted);
}

.todo__error:empty {
  display: none;
}

.todo__reason {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--text-muted);
}

.action-output:empty {
  padding: 0;
}

.action-output {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  align-items: flex-start;
  padding: var(--space-2);
  border-radius: var(--radius-control);
  background: var(--surface-sunken);
}

.action-output__text {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.button[aria-busy="true"] {
  font-style: italic;
}

.empty {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  align-items: flex-start;
  margin: var(--space-5);
  padding: var(--space-5);
  border-radius: var(--radius-control);
  background: var(--surface-sunken);
}

.empty__title {
  color: var(--heading);
  font-family: var(--font-heading);
  margin: 0;
  font-size: var(--text-lg);
  font-weight: 650;
}

.empty__body {
  margin: 0;
  color: var(--text-muted);
}

@media (forced-colors: active) {
  .session[aria-current="true"] {
    outline: 2px solid Highlight;
    outline-offset: -2px;
  }

  .button,
  .sidebar__select {
    border: 1px solid ButtonText;
  }

  .button__arrow {
    background: ButtonText;
    color: ButtonFace;
  }

  .button:disabled,
  .button[aria-disabled="true"] {
    border-color: GrayText;
    color: GrayText;
  }
}

@media (max-width: 640px) {
  .notebook__header {
    padding: var(--space-3) var(--space-4);
  }

  .notebook__body {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 1fr;
  }

  .sidebar {
    padding: var(--space-3) var(--space-4);
    border-right: 0;
    border-bottom: 1px solid var(--hairline);
  }

  .sidebar__heading,
  .meeting-list {
    display: none;
  }

  .sidebar__select {
    display: block;
  }

  .meeting {
    padding: var(--space-4);
  }

  .empty {
    margin: var(--space-4);
  }
}
</style>
</head>
<body>
<div class="notebook">
  <header class="notebook__header">
    <svg class="notebook__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="5" y="3" width="14" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
      <path d="M9 8h6M9 12h6M9 16h3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    </svg>
    <h1 class="notebook__title">Scribe notebook</h1>
    <p class="notebook__count" id="meeting-count"></p>
  </header>
  <div class="notebook__body">
    <nav class="sidebar" id="sidebar" aria-label="Meetings"></nav>
    <main id="meeting-pane"></main>
  </div>
</div>
<script>
(function scribeNotebook() {
  const FALLBACK_MEETING_TYPE = "Meeting";
  const AI_UNAVAILABLE_REASON = "AI actions need Claude web or Desktop on a paid plan.";
  const ACTION_FAILED_MESSAGE = "Couldn't run this action. Try again.";
  const ARROW_ICON =
    '<svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 5h6M5.5 2.5L8 5L5.5 7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  const WORKING_LABEL = "Working…";
  const UNTITLED_MEETING = "Untitled meeting";
  const NO_MEETINGS_TITLE = "No meetings yet";
  const NO_MEETINGS_HINT = "Run /meeting-notes in Claude to add your first meeting.";
  const TODO_READ_ONLY_REASON = "You can view this notebook but not tick todos.";
  const TODO_NOT_SAVED_MESSAGE = "Couldn't save that change. Try again.";
  const TODO_READ_ONLY_REASON_ID = "todo-read-only-reason";
  const DATABASE_UNAVAILABLE_MESSAGE = "This notebook needs Claude to load. Open it on claude.ai while signed in.";

  const COLLECTIONS = { meetings: "meetings", meetingIndex: "meeting_index", todos: "todos" };

  function records(list) {
    return Array.isArray(list) ? list.filter((entry) => entry !== null && typeof entry === "object") : [];
  }

  function strings(list) {
    return Array.isArray(list) ? list.filter((entry) => typeof entry === "string") : [];
  }

  function textOf(value) {
    return typeof value === "string" ? value : "";
  }

  function numberOrNull(value) {
    return typeof value === "number" ? value : null;
  }

  function bodyOf(snapshot) {
    const body = snapshot.data();
    return body !== null && typeof body === "object" ? body : {};
  }

  function asMeetingSummary(snapshot) {
    const body = bodyOf(snapshot);
    return {
      id: snapshot.id,
      title: textOf(body.title),
      started_at: textOf(body.started_at),
      duration_seconds: numberOrNull(body.duration_seconds),
      type: textOf(body.type)
    };
  }

  function asMeeting(snapshot) {
    const body = bodyOf(snapshot);
    return {
      ...asMeetingSummary(snapshot),
      summary: textOf(body.summary),
      speakers: records(body.speakers),
      blocks: records(body.blocks),
      todo_ids: strings(body.todo_ids)
    };
  }

  function asTodo(snapshot) {
    const body = bodyOf(snapshot);
    return {
      id: snapshot.id,
      meeting_id: textOf(body.meeting_id),
      meeting_title: textOf(body.meeting_title),
      meeting_started_at: textOf(body.meeting_started_at),
      todo_id: textOf(body.todo_id),
      text: textOf(body.text),
      owner: textOf(body.owner),
      due: textOf(body.due),
      actions: records(body.actions),
      done: body.done === true,
      done_at: textOf(body.done_at) || null
    };
  }

  const UNKNOWN_START = Number.MIN_SAFE_INTEGER;

  function startTime(summary) {
    const time = new Date(summary.started_at).getTime();
    return Number.isNaN(time) ? UNKNOWN_START : time;
  }

  function compareNewestFirst(left, right) {
    return startTime(right) - startTime(left) || naturalOrder(right.id, left.id);
  }

  function orderNewestFirst(summaries) {
    return [...summaries].sort(compareNewestFirst);
  }

  function selectionWithin(summaries, selectedId) {
    if (summaries.some((summary) => summary.id === selectedId)) {
      return selectedId;
    }
    return summaries[0]?.id ?? null;
  }

  function naturalOrder(left, right) {
    return left.localeCompare(right, undefined, { numeric: true });
  }

  function listedPosition(todoIds, todoId) {
    const index = todoIds.indexOf(todoId);
    return index === -1 ? todoIds.length : index;
  }

  function todosOfMeeting(todos, meeting) {
    const position = (todo) => listedPosition(meeting.todo_ids, todo.todo_id);
    return todos
      .filter((todo) => todo.meeting_id === meeting.id)
      .sort((left, right) => position(left) - position(right) || naturalOrder(left.todo_id, right.todo_id));
  }

  async function useCapability(name) {
    if (typeof window.claude?.use !== "function") {
      return null;
    }
    try {
      return await window.claude.use(name);
    } catch (error) {
      logFailure(error);
      return null;
    }
  }

  async function resolveCanWriteTodos() {
    const user = await useCapability("user");
    if (typeof user?.can !== "function") {
      return null;
    }
    try {
      const allowed = await user.can("data.write");
      return typeof allowed === "boolean" ? allowed : null;
    } catch (error) {
      logFailure(error);
      return null;
    }
  }

  function todoDoneState(todos, todoDocId) {
    return todos.find((todo) => todo.id === todoDocId)?.done === true;
  }

  async function resolveNotebookStore() {
    const db = await useCapability("db");
    return db ? createNotebookStore(db) : null;
  }

  function createNotebookStore(db) {
    return {
      watchMeetingIndex: (onChange, onError) =>
        db.collection(COLLECTIONS.meetingIndex).onSnapshot((snapshot) => onChange(snapshot.docs.map(asMeetingSummary)), onError),
      watchMeeting: (meetingId, onChange, onError) =>
        db.collection(COLLECTIONS.meetings).doc(meetingId).onSnapshot((snapshot) => onChange(snapshot.exists ? asMeeting(snapshot) : null), onError),
      watchTodos: (onChange, onError) =>
        db.collection(COLLECTIONS.todos).onSnapshot((snapshot) => onChange(snapshot.docs.map(asTodo)), onError),
      setTodoDone: (todoDocId, done, doneAt) =>
        db.doc(COLLECTIONS.todos + "/" + todoDocId).update({ done, done_at: doneAt })
    };
  }

  async function resolveAskClaude() {
    const sample = await useCapability("sample");
    return typeof sample === "function" ? (prompt) => sample(prompt) : null;
  }

  function completionText(completion) {
    const text = completion?.text;
    return typeof text === "string" ? text : "";
  }

  function element(tagName, className, text) {
    const node = document.createElement(tagName);
    if (className) {
      node.className = className;
    }
    if (text !== undefined) {
      node.textContent = text;
    }
    return node;
  }

  function meetingTitle(meeting) {
    return typeof meeting.title === "string" && meeting.title.trim() ? meeting.title : UNTITLED_MEETING;
  }

  function formatStart(startedAt) {
    const date = new Date(startedAt);
    if (Number.isNaN(date.getTime())) {
      return "";
    }
    return date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function formatDuration(durationSeconds) {
    if (typeof durationSeconds !== "number") {
      return "";
    }
    const minutes = Math.max(1, Math.round(durationSeconds / 60));
    return minutes + " min";
  }

  function formatWhen(meeting) {
    return [formatStart(meeting.started_at), formatDuration(meeting.duration_seconds)]
      .filter(Boolean)
      .join(" · ");
  }

  function renderMeetingCount(count) {
    document.getElementById("meeting-count").textContent = count === 1 ? "1 meeting" : count + " meetings";
  }

  function clearMeetingCount() {
    document.getElementById("meeting-count").textContent = "";
  }

  function patchMeetingList(summaries) {
    const sidebar = document.getElementById("sidebar");
    if (summaries.length === 0) {
      sidebar.replaceChildren();
      return;
    }
    if (!sidebar.querySelector(".meeting-list")) {
      sidebar.replaceChildren(element("h2", "sidebar__heading", "Meetings"), buildMeetingSelect(), element("ul", "meeting-list"));
    }
    document.getElementById("meeting-select").replaceChildren(...summaries.map(buildMeetingOption));
    sidebar.querySelector(".meeting-list").replaceChildren(...summaries.map(buildMeetingButton));
  }

  function buildMeetingSelect() {
    const wrapper = element("div");
    const label = element("label", "visually-hidden", "Choose a meeting");
    label.htmlFor = "meeting-select";
    const select = element("select", "sidebar__select");
    select.id = "meeting-select";
    select.addEventListener("change", () => selectMeeting(select.value));
    wrapper.append(label, select);
    return wrapper;
  }

  function buildMeetingOption(meeting) {
    const option = element("option", "", meetingTitle(meeting) + " (" + formatWhen(meeting) + ")");
    option.value = meeting.id;
    return option;
  }

  function buildMeetingButton(meeting) {
    const item = element("li");
    const button = element("button", "session");
    button.type = "button";
    button.dataset.meetingId = meeting.id;
    button.setAttribute("aria-current", "false");
    button.append(element("span", "session__title", meetingTitle(meeting)), element("span", "session__meta", formatWhen(meeting)));
    button.addEventListener("click", () => selectMeeting(meeting.id));
    item.append(button);
    return item;
  }

  function markSelected(id) {
    document.querySelectorAll(".session").forEach((button) => {
      button.setAttribute("aria-current", String(button.dataset.meetingId === id));
    });
    const select = document.getElementById("meeting-select");
    if (select && id !== null) {
      select.value = id;
    }
  }

  function showInPane(...nodes) {
    document.getElementById("meeting-pane").replaceChildren(...nodes);
  }

  function renderMeeting(meeting, todos) {
    const article = element("article", "meeting");
    article.append(
      renderMeetingHeader(meeting),
      renderSpeakers(meeting.speakers),
      renderSummary(meeting.summary),
      renderBlocks(meeting.blocks),
      renderTodos(meeting, todos)
    );
    showInPane(article);
  }

  function renderEmptyState() {
    const empty = element("section", "empty");
    empty.append(element("h2", "empty__title", NO_MEETINGS_TITLE), element("p", "empty__body", NO_MEETINGS_HINT));
    return empty;
  }

  function renderUnavailableState() {
    const unavailable = element("section", "empty");
    unavailable.append(element("p", "empty__body", DATABASE_UNAVAILABLE_MESSAGE));
    return unavailable;
  }

  function meetingTypeLabel(meeting) {
    return typeof meeting.type === "string" && meeting.type.trim() ? meeting.type : FALLBACK_MEETING_TYPE;
  }

  function renderMeetingHeader(meeting) {
    const header = element("header", "meeting__header");
    const meta = element("p", "meeting__meta");
    meta.append(element("span", "badge", meetingTypeLabel(meeting)));
    meta.append(element("span", "", formatWhen(meeting)));
    header.append(element("h2", "meeting__title", meetingTitle(meeting)), meta);
    return header;
  }

  function renderSummary(summary) {
    const panel = element("section", "panel");
    panel.append(element("h3", "panel__heading", "Summary"), element("p", "panel__body", summary || ""));
    return panel;
  }

  function speakerDisplayName(speaker) {
    if (speaker.label === "Me") {
      return "Me";
    }
    if (speaker.confidence === "unknown" || !speaker.name) {
      return "Them";
    }
    return speaker.name;
  }

  function speakerConfidenceNote(speaker) {
    if (speaker.label === "Me") {
      return "";
    }
    if (speaker.confidence === "likely") {
      return " (inferred)";
    }
    if (speaker.confidence === "stated") {
      return " (named in the call)";
    }
    return " (one or more people)";
  }

  function renderSpeaker(speaker) {
    const item = element("li", "speaker");
    const details = element("details");
    const summary = element("summary", "speaker__name", speakerDisplayName(speaker));
    summary.append(element("span", "speaker__confidence", speakerConfidenceNote(speaker)));
    details.append(summary);
    if (speaker.evidence) {
      details.append(element("p", "speaker__evidence", speaker.evidence));
    }
    item.append(details);
    return item;
  }

  function renderSpeakers(speakers) {
    const panel = element("section", "panel");
    const list = element("ul", "speakers");
    speakers.forEach((speaker) => list.append(renderSpeaker(speaker)));
    panel.append(element("h3", "panel__heading", "Speakers"), list);
    return panel;
  }

  function labelledBlock(className, label, text) {
    const block = element("p", "block " + className);
    if (label) {
      block.append(element("span", "block__label", label));
    }
    block.append(textOf(text));
    return block;
  }

  function renderHeadingBlock(block) {
    return element("h3", "block block--heading", textOf(block.text));
  }

  function renderParagraphBlock(block) {
    return element("p", "block", textOf(block.text));
  }

  function renderListBlock(block) {
    const list = element("ul", "block item-list");
    (Array.isArray(block.items) ? block.items : []).filter((text) => typeof text === "string").forEach((text) => {
      const item = element("li", "item");
      item.append(element("span", "item__text", text));
      list.append(item);
    });
    return list;
  }

  function renderDecisionBlock(block) {
    const by = textOf(block.by);
    return labelledBlock("block--decision", by ? "Decision · " + by : "Decision", block.text);
  }

  function renderMetricBlock(block) {
    const metric = element("p", "block block--metric");
    metric.append(element("span", "block__label", textOf(block.label)), element("span", "block__figure", textOf(block.value)));
    if (textOf(block.note)) {
      metric.append(element("span", "block__note", block.note));
    }
    return metric;
  }

  function renderQuoteBlock(block) {
    const quote = element("blockquote", "block block--quote", textOf(block.text));
    if (textOf(block.speaker)) {
      quote.append(element("span", "block__label", "— " + block.speaker));
    }
    return quote;
  }

  function tableCells(row) {
    return Array.isArray(row) ? row.map((cell) => (typeof cell === "string" || typeof cell === "number" ? String(cell) : "")) : [];
  }

  function appendCells(row, cellTag, cells) {
    cells.forEach((cell) => row.append(element(cellTag, "", cell)));
    return row;
  }

  function renderTableBlock(block) {
    const columns = tableCells(block.columns);
    const table = element("table", "block__table");
    const head = element("thead");
    head.append(appendCells(element("tr"), "th", columns));
    const body = element("tbody");
    (Array.isArray(block.rows) ? block.rows : []).filter(Array.isArray).forEach((row) => body.append(appendCells(element("tr"), "td", tableCells(row))));
    table.append(head, body);
    const scroller = element("div", "block block__table-scroll");
    scroller.append(table);
    return scroller;
  }

  function renderScreenBlock(block) {
    const screen = element("p", "block block--screen");
    screen.append(element("span", "offset-chip", textOf(block.offset)), element("span", "", "Screen: " + textOf(block.caption)));
    return screen;
  }

  function renderCalloutBlock(block) {
    const isRisk = block.tone === "risk";
    return labelledBlock("block--callout" + (isRisk ? " block--risk" : ""), isRisk ? "Risk" : "Note", block.text);
  }

  const BLOCK_RENDERERS = {
    heading: renderHeadingBlock,
    paragraph: renderParagraphBlock,
    list: renderListBlock,
    decision: renderDecisionBlock,
    metric: renderMetricBlock,
    quote: renderQuoteBlock,
    table: renderTableBlock,
    screen: renderScreenBlock,
    callout: renderCalloutBlock
  };

  function renderBlocks(blocks) {
    const wrapper = element("div", "block-list");
    blocks
      .filter((block) => Object.hasOwn(BLOCK_RENDERERS, block.kind))
      .forEach((block) => wrapper.append(BLOCK_RENDERERS[block.kind](block)));
    return wrapper;
  }

  function describeTodo(todo) {
    return ["Owner: " + (todo.owner || "Unassigned"), todo.due ? "Due: " + todo.due : ""]
      .filter(Boolean)
      .join(" · ");
  }

  function canAskClaude() {
    return state.askClaude !== null;
  }

  async function runAction(action, outputElement) {
    try {
      const text = completionText(await state.askClaude(action.prompt));
      if (!text.trim()) {
        throw new Error("empty completion");
      }
      renderActionResult(outputElement, text);
    } catch (error) {
      const failure = element("p", "action-output__text", ACTION_FAILED_MESSAGE);
      failure.setAttribute("role", "alert");
      outputElement.replaceChildren(failure);
    }
  }

  function renderActionResult(outputElement, text) {
    outputElement.replaceChildren(element("p", "action-output__text", text));
    if (typeof navigator.clipboard?.writeText === "function") {
      outputElement.append(buildCopyButton(text));
    }
  }

  function buildCopyButton(text) {
    const button = element("button", "button", "Copy");
    button.type = "button";
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "Copied";
      } catch (error) {
        button.textContent = "Couldn't copy";
      }
    });
    return button;
  }

  function buildArrowChip() {
    const chip = element("span", "button__arrow");
    chip.innerHTML = ARROW_ICON;
    return chip;
  }

  function buildActionButton(action, outputElement, reasonId) {
    const button = element("button", "button");
    const label = element("span", "button__label", action.label);
    button.append(label, buildArrowChip());
    button.type = "button";
    if (!canAskClaude()) {
      button.disabled = true;
      button.setAttribute("aria-describedby", reasonId);
      return button;
    }
    button.addEventListener("click", async () => {
      if (button.getAttribute("aria-disabled") === "true") {
        return;
      }
      button.setAttribute("aria-disabled", "true");
      button.setAttribute("aria-busy", "true");
      label.textContent = WORKING_LABEL;
      await runAction(action, outputElement);
      label.textContent = action.label;
      button.removeAttribute("aria-busy");
      button.removeAttribute("aria-disabled");
    });
    return button;
  }

  function isRunnableAction(action) {
    return typeof action.label === "string" && action.label !== "" && typeof action.prompt === "string" && action.prompt !== "";
  }

  function renderActions(meeting, todo) {
    const wrapper = element("div", "todo__actions-group");
    const actions = element("div", "todo__actions");
    const output = element("div", "action-output");
    output.setAttribute("aria-live", "polite");
    const reasonId = "reason-" + meeting.id + "-" + todo.todo_id;
    todo.actions.filter(isRunnableAction).forEach((action) => actions.append(buildActionButton(action, output, reasonId)));
    wrapper.append(actions);
    if (!canAskClaude() && actions.children.length > 0) {
      const reason = element("p", "todo__reason", AI_UNAVAILABLE_REASON);
      reason.id = reasonId;
      wrapper.append(reason);
    }
    wrapper.append(output);
    return wrapper;
  }

  function renderTodo(meeting, todo) {
    const item = element("li", "item" + (todo.owner === "Me" ? " line--me" : ""));
    const body = element("div", "todo");
    const choice = element("label", "todo__choice");
    const checkbox = element("input", "todo__checkbox");
    checkbox.type = "checkbox";
    checkbox.dataset.todoId = todo.todo_id;
    checkbox.dataset.todoDocId = todo.id;
    checkbox.checked = state.pendingTicks.get(todo.id) ?? todo.done;
    checkbox.addEventListener("change", () => toggleTodoDone(todo.id, checkbox.checked));
    const notSaved = element("p", "todo__error");
    notSaved.setAttribute("role", "alert");
    choice.append(checkbox, element("span", "todo__text", todo.text));
    body.append(choice, notSaved, element("p", "todo__meta", describeTodo(todo)), renderActions(meeting, todo));
    item.append(body);
    return item;
  }

  function renderTodos(meeting, todos) {
    const panel = element("section", "panel panel--todos");
    const list = element("ul", "item-list");
    todos.forEach((todo) => list.append(renderTodo(meeting, todo)));
    panel.append(element("h3", "panel__heading", "Todos"), list);
    if (state.canWriteTodos === false) {
      lockReadOnlyChecks(panel, TODO_READ_ONLY_REASON_ID);
    }
    return panel;
  }

  function lockReadOnlyChecks(root, reasonId) {
    const reason = element("p", "todo__reason", TODO_READ_ONLY_REASON);
    reason.id = reasonId;
    root.querySelector(".panel__heading")?.after(reason);
    root.querySelectorAll(".todo__checkbox").forEach((checkbox) => {
      checkbox.disabled = true;
      checkbox.setAttribute("aria-describedby", reasonId);
    });
  }

  function todoCheckboxes(root) {
    return Array.from(root.querySelectorAll(".todo__checkbox"));
  }

  function checkboxOfTodo(root, todoDocId) {
    return todoCheckboxes(root).find((checkbox) => checkbox.dataset.todoDocId === todoDocId);
  }

  function patchTodoChecks(root, todos) {
    todos
      .filter((todo) => !state.pendingTicks.has(todo.id))
      .forEach((todo) => {
        const checkbox = checkboxOfTodo(root, todo.id);
        if (checkbox) {
          checkbox.checked = todo.done;
        }
      });
  }

  function showsExactly(root, todos) {
    const shown = todoCheckboxes(root).map((checkbox) => checkbox.dataset.todoDocId);
    return shown.length === todos.length && todos.every((todo) => shown.includes(todo.id));
  }

  async function toggleTodoDone(todoDocId, done) {
    const isWriteInFlight = state.pendingTicks.has(todoDocId);
    state.pendingTicks.set(todoDocId, done);
    showTickMessage(todoDocId, "");
    if (!isWriteInFlight) {
      await flushTick(todoDocId);
    }
  }

  async function flushTick(todoDocId) {
    try {
      let written;
      do {
        written = state.pendingTicks.get(todoDocId);
        await state.store.setTodoDone(todoDocId, written, written ? new Date().toISOString() : null);
      } while (state.pendingTicks.get(todoDocId) !== written);
      state.pendingTicks.delete(todoDocId);
    } catch (error) {
      state.pendingTicks.delete(todoDocId);
      undoTick(todoDocId);
      logFailure(error);
    }
  }

  function undoTick(todoDocId) {
    const checkbox = checkboxOfTodo(document, todoDocId);
    if (checkbox) {
      checkbox.checked = todoDoneState(state.todos, todoDocId);
    }
    showTickMessage(todoDocId, TODO_NOT_SAVED_MESSAGE);
  }

  function showTickMessage(todoDocId, message) {
    const notSaved = checkboxOfTodo(document, todoDocId)?.closest(".todo")?.querySelector(".todo__error");
    if (notSaved) {
      notSaved.textContent = message;
    }
  }

  function replaceTodoPanel(meeting, todos) {
    document.querySelector("#meeting-pane .panel--todos")?.replaceWith(renderTodos(meeting, todos));
  }

  function logFailure(error) {
    console.error(error);
  }

  const state = {
    store: null,
    summaries: [],
    selectedId: null,
    selectedMeeting: null,
    todos: [],
    canWriteTodos: null,
    pendingTicks: new Map(),
    askClaude: null,
    unwatchSelected: null,
    unwatchNotebook: []
  };

  async function start() {
    const store = await resolveNotebookStore();
    if (!store) {
      showUnavailable();
      return;
    }
    state.store = store;
    state.unwatchNotebook = [store.watchMeetingIndex(showSummaries, showFailure), store.watchTodos(showTodos, showFailure)];
    state.canWriteTodos = await resolveCanWriteTodos();
    state.askClaude = await resolveAskClaude();
    refreshSelectedTodos();
  }

  function showSummaries(summaries) {
    state.summaries = orderNewestFirst(summaries);
    renderMeetingCount(state.summaries.length);
    patchMeetingList(state.summaries);
    followSelection(selectionWithin(state.summaries, state.selectedId));
  }

  function followSelection(id) {
    if (id !== null && id === state.selectedId) {
      markSelected(id);
      return;
    }
    selectMeeting(id);
  }

  function selectMeeting(id) {
    stopWatchingSelected();
    state.selectedId = id;
    state.selectedMeeting = null;
    markSelected(id);
    if (id === null) {
      showInPane(renderEmptyState());
      return;
    }
    showInPane();
    state.unwatchSelected = state.store.watchMeeting(id, (meeting) => showSelectedMeeting(id, meeting), showFailure);
  }

  function showSelectedMeeting(meetingId, meeting) {
    if (meetingId !== state.selectedId) {
      return;
    }
    state.selectedMeeting = meeting;
    if (!meeting) {
      showInPane();
      return;
    }
    renderMeeting(meeting, todosOfMeeting(state.todos, meeting));
  }

  function showTodos(todos) {
    state.todos = todos;
    syncSelectedTodos();
  }

  function syncSelectedTodos() {
    if (!state.selectedMeeting) {
      return;
    }
    const todosOfSelected = todosOfMeeting(state.todos, state.selectedMeeting);
    const panel = document.querySelector("#meeting-pane .panel--todos");
    if (panel && showsExactly(panel, todosOfSelected)) {
      patchTodoChecks(panel, todosOfSelected);
      return;
    }
    refreshSelectedTodos();
  }

  function refreshSelectedTodos() {
    if (state.selectedMeeting) {
      replaceTodoPanel(state.selectedMeeting, todosOfMeeting(state.todos, state.selectedMeeting));
    }
  }

  function showFailure(error) {
    showUnavailable();
    logFailure(error);
  }

  function showUnavailable() {
    stopWatching();
    clearMeetingCount();
    patchMeetingList([]);
    showInPane(renderUnavailableState());
  }

  function stopWatching() {
    stopWatchingSelected();
    state.unwatchNotebook.forEach((unwatch) => unwatch());
    state.unwatchNotebook = [];
  }

  function stopWatchingSelected() {
    if (state.unwatchSelected) {
      state.unwatchSelected();
      state.unwatchSelected = null;
    }
  }

  start().catch(showFailure);
})();
</script>
</body>
</html>
